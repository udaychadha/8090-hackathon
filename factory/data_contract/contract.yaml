schema_version: '1.0.0'
title: Market data and strategy-time contract
calendar:
  name: XNYS
  timezone: America/New_York
  library: exchange-calendars
  version: '4.13.2'
  timestamp_timezone: UTC
  minute_duration: 1
  fill_limit: 5
semantics:
  - Minute timestamps label bar START, with a left-inclusive and right-exclusive interval. The close becomes usable one minute after its label.
  - XNYS regular sessions contain 09:30 through 15:59 New York labels; there is no 16:00 bar. A 13:00 early close ends with the 12:59 label.
  - Daily timestamps label the session date at New York midnight (04:00Z in daylight time, 05:00Z in standard time); they are neither trading times nor availability times.
  - Daily bars are provider day aggregates, not reductions of retained regular-session minutes. Extended-hours volume, trade-condition rules and revisions can differ. Final daily OHLCV is not guaranteed available at the regular-session close; this is a historical, not point-in-time, dataset.
  - Session offsets describe the bar START. For minute decisions, add one minute to minutes_since_open to obtain elapsed time when that bar closes. Daily offsets describe the session open, with both boundary flags true.
  - Session boundary flags use scheduled calendar slots, never the first or last observed row in a slice. Missing bars and truncated evaluation slices do not move the session boundaries.
  - A target at t earns the next bar's close-to-close return through the engine's one-row execution lag. Do not shift target weights forward. The engine does not flatten overnight; an intraday strategy must set its last-session target to zero.
  - Example for a full session, long from 10:00 through 15:30 New York time; set target one where minutes_since_open is at least 29 and less than 359. Those labels close at 10:00 through 15:29; the target is zero on the 15:29 label whose close is at 15:30.
  - Only missing minutes following an observed close within the same session can be filled, for at most five consecutive minutes. Filled OHLC equal that prior close and volume is zero. Daily bars are never locally filled. Remaining gaps stay absent.
  - is_filled identifies repository synthesis only. A provider row with zero volume may be real or upstream synthetic; is_filled false does not prove trading occurred.
  - Alpaca SIP adjustment all applies split, dividend and spin-off price adjustments. Volume is split-adjusted shares; dividends and spin-offs do not rescale volume. Raw factors and historical revision times are not retained.
  - All prices use USD per share. Current S&P membership in the daily universe introduces survivorship bias. Provider symbol mapping and final adjusted histories are not point-in-time instrument membership.
  - IS, OOS and HOLDOUT are disjoint chronological 60/20/20 slices of the shared expected tier grid; they may bisect sessions and differ across tiers. Workers receive IS only. HOLDOUT is sealed from strategy/model runs.
  - Session columns and is_filled are preserved through execution. Derived session columns are read-only inputs; changing or deleting them causes a contract error before strategy output is accepted.
  - Strategy activity is a bug check on IS target weights only. A traded day is an exchange date with any nonzero target, including held exposure; this is not a performance or turnover threshold.
activity:
  minimum_days: 5
  status: INACTIVE
  message: 'strategy never trades; check session-time logic'
ontology:
  Instrument:
    description: An equity or ETF identified in a provider snapshot, not a point-in-time constituent history.
    fields:
      symbol: {dtype: string, units: identifier, pattern: '^[A-Z][A-Z0-9.]{0,14}$', description: Provider symbol including share-class dots.}
      asset_class: {dtype: string, units: category, allowed: [equity, etf], description: Instrument classification.}
      currency: {dtype: string, units: ISO4217, allowed: [USD], description: Currency of every price.}
      calendar: {dtype: string, units: identifier, allowed: [XNYS], description: Session calendar used by this dataset.}
      timezone: {dtype: string, units: IANA, allowed: [America/New_York], description: Exchange timezone for session dates and offsets.}
  Session:
    description: Scheduled trading interval from the pinned exchange calendar, including early closes and holidays.
    fields:
      session_date: {dtype: 'datetime64[ns, America/New_York]', units: exchange_date, description: Exchange date represented at local midnight.}
      open: {dtype: 'datetime64[ns, UTC]', units: instant, description: Scheduled regular-session opening instant.}
      close: {dtype: 'datetime64[ns, UTC]', units: instant, description: Scheduled regular-session closing instant.}
      duration_minutes: {dtype: int64, units: minutes, minimum: 1, description: Actual scheduled close minus open in minutes.}
  Bar:
    description: One retained price aggregate with explicit local synthesis provenance.
    fields:
      timestamp: {dtype: 'datetime64[ns, UTC]', units: instant, location: index, description: Minute interval start or daily New York midnight label.}
      open: {dtype: float64, units: USD/share, description: Adjusted first eligible price or prior close for a filled bar.}
      high: {dtype: float64, units: USD/share, description: Adjusted maximum eligible price or prior close for a filled bar.}
      low: {dtype: float64, units: USD/share, description: Adjusted minimum eligible price or prior close for a filled bar.}
      close: {dtype: float64, units: USD/share, description: Adjusted last eligible price or prior close for a filled bar.}
      volume: {dtype: float64, units: shares, description: Split-adjusted provider volume or zero for a filled bar.}
      is_filled: {dtype: bool, units: flag, description: Whether this repository synthesized the row.}
    derived_fields:
      session_date: {dtype: 'datetime64[ns, America/New_York]', units: exchange_date, derive: local_date, read_only: true, description: Scheduled session date at exchange-local midnight.}
      minutes_since_open: {dtype: int64, units: minutes, derive: elapsed_start, read_only: true, description: Minutes from scheduled open to minute label; zero for a daily bar.}
      minutes_to_close: {dtype: int64, units: minutes, derive: remaining_start, read_only: true, description: Minutes from minute label to scheduled close; full session duration for a daily bar.}
      is_first_bar: {dtype: bool, units: flag, derive: scheduled_first, read_only: true, description: Whether this is the scheduled first slot; true for a daily bar.}
      is_last_bar: {dtype: bool, units: flag, derive: scheduled_last, read_only: true, description: Whether this is the scheduled last slot; true for a daily bar.}
  Dataset:
    description: A validated immutable data file and its per-file provenance manifest.
    fields:
      name: {dtype: string, units: identifier, description: Dataset name used in all validation errors.}
      kind: {dtype: string, units: category, allowed: [price_bars, events], description: Selects the generated dataset validator.}
      schema_version: {dtype: string, units: version, allowed: ['1.0.0'], description: Contract schema used to validate this dataset.}
      source: {dtype: string, units: provenance, description: Provider or approved source URL without credentials.}
      feed: {dtype: string, units: identifier, allowed: [sip, user_supplied], description: Provider feed or user supplied event source.}
      adjustment: {dtype: string, units: category, allowed: [all, not_applicable], description: Price and volume adjustment convention; not applicable for events.}
      date_range: {dtype: object, units: UTC_bounds, description: Inclusive actual first and last timestamps as start and end UTC ISO strings.}
      row_count: {dtype: int64, units: rows, minimum: 1, description: Exact count of physically stored rows.}
      fill_rate: {dtype: float64, units: fraction, minimum: 0, maximum: 1, description: Locally filled rows divided by expected price grid length; zero for events.}
      created_at: {dtype: utc_string, units: instant, description: Original dataset write timestamp when known.}
      sha256: {dtype: string, units: digest, pattern: '^[a-f0-9]{64}$', description: SHA-256 fingerprint of the stored file bytes.}
      frequency: {dtype: string, units: interval, allowed: [1min, 1day, event], description: Price aggregation interval or event data.}
      start: {dtype: date_string, units: exchange_date, description: Inclusive requested start date.}
      through: {dtype: date_string, units: exchange_date, description: Inclusive requested final date.}
      calendar: {dtype: string, units: identifier, allowed: [XNYS], description: Calendar identity used to validate labels.}
      calendar_version: {dtype: string, units: version, allowed: ['4.13.2'], description: Pinned exchange calendar library version.}
  Split:
    description: Inclusive boundaries on the shared tier grid; not independently computed per symbol.
    fields:
      name: {dtype: string, units: category, allowed: [IS, OOS, HOLDOUT], description: Partition visibility label.}
      start: {dtype: utc_string, units: instant, description: Inclusive first timestamp in this partition.}
      end: {dtype: utc_string, units: instant, description: Inclusive last timestamp in this partition.}
      fraction: {dtype: float64, units: fraction, allowed: [0.6, 0.2], description: Requested fraction of expected tier rows.}
datasets:
  price_bars:
    entity: Bar
    extra_columns: false
    invariants:
      - {id: nonempty, op: nonempty, description: Stored datasets contain at least one row.}
      - {id: columns, op: schema, description: Physical columns and index match Bar fields and exact dtypes.}
      - {id: timestamp_order, op: ordered_index, description: Timestamps are UTC nanoseconds with no NaT or duplicates and strictly increasing order.}
      - {id: finite, op: finite, fields: [open, high, low, close, volume], description: Every OHLCV value is finite.}
      - {id: positive, op: lower_bound, fields: [open, high, low, close], minimum: 0, strict: true, description: Every price is strictly positive.}
      - {id: nonnegative, op: lower_bound, fields: [volume], minimum: 0, strict: false, description: Volume is nonnegative.}
      - {id: ohlc_bounds, op: ohlc_bounds, description: High is at least open/close/low and low is at most open/close/high.}
      - {id: calendar, op: calendar, description: Every label lies on the expected XNYS grid within requested dates.}
      - {id: fill_shape, op: fill_shape, description: Filled rows have flat OHLC and zero volume; daily rows are never filled.}
      - {id: fill_history, op: fill_history, description: Full stored minute files exactly reproduce the declared within-session fill rule from their observed rows.}
  events:
    extra_columns: true
    fields:
      available_at: {dtype: 'datetime64[ns, UTC]', units: instant, description: Earliest timestamp when the information could have been known.}
      symbol: {dtype: string, units: identifier, pattern: '^[A-Z][A-Z0-9.]{0,14}$', description: Instrument symbol to which the event applies.}
    extension_dtypes: [float64, int64, bool, string, 'datetime64[ns, UTC]']
    invariants:
      - {id: nonempty, op: nonempty, description: Stored event datasets contain at least one row.}
      - {id: columns, op: schema, description: Events require UTC available_at and a string symbol; extensions use declared scalar dtypes.}
      - {id: availability_order, op: sorted_column, field: available_at, description: Availability timestamps are non-null and in nondecreasing order.}
      - {id: symbol, op: pattern, field: symbol, pattern: '^[A-Z][A-Z0-9.]{0,14}$', description: Event symbols use the supported instrument-symbol syntax.}
      - {id: event_values, op: event_values, description: Event cells are non-null and numeric values are finite.}
record_invariants:
  - {id: entity_fields, op: entity_fields, description: Every ontology record has all required fields with declared types and allowed values.}
  - {id: session_interval, op: session_interval, description: Session open and close match the pinned calendar and duration is their difference.}
  - {id: split_interval, op: split_interval, description: Split start is no later than end and its fraction matches its name.}
  - {id: manifest_content, op: manifest_content, description: Manifest schema and provenance match the validated file fingerprint, actual bounds, row count and fill rate.}
  - {id: session_derivation, op: session_derivation, description: Derived session fields equal their calendar-based definitions and cannot be changed by strategies.}
  - {id: activity, op: activity, description: Full IS target weights must be nonzero on at least five exchange dates; otherwise status is INACTIVE and self-heal receives the specified message.}
