[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "financial-models-in-the-arena"
version = "0.1.0"
description = "Deterministic verification for paper-derived trading strategies"
requires-python = ">=3.11"
dependencies = [
  "alpaca-py>=0.43,<0.44",
  "numpy>=2.1,<3",
  "pandas>=2.2,<3",
  "pyarrow>=18,<24",
  "pydantic>=2.10,<3",
  "python-dotenv>=1,<2",
  "requests>=2.32,<3",
  "exchange-calendars>=4.11,<5",
  "lxml>=5,<7",
  "pymupdf>=1.25,<2",
  "openai>=1.68,<3",
  "anthropic>=0.49,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.12,<1"]

[tool.setuptools.packages.find]
include = ["factory*"]

[tool.pytest.ini_options]
testpaths = ["tests", "factory/agents"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

